name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - run: python -m pip install ruff
      - run: ruff check .

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      INSIGHTER_DISABLE_BACKGROUND_SIM: "1"
      INSIGHTER_LLM_WARMUP: "0"
      INSIGHTER_SECRET_KEY: ci-test-key
      INSIGHTER_DB_PATH: ${{ runner.temp }}/insighter-ci.db
      EXPECTED_MIN_TESTS: "135"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libxcb-cursor0 fonts-dejavu-core
      - run: python -m pip install -r requirements.txt -r requirements-desktop.txt
      - name: Run unittest suite
        shell: bash
        run: |
          set -o pipefail
          python scripts/run_tests_ci.py 2>&1 | tee test-output.txt
      - name: Verify discovered test count
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import sys

          output_path = pathlib.Path("test-output.txt")
          output = output_path.read_text(encoding="utf-8", errors="replace")
          output_path.unlink(missing_ok=True)
          run_match = re.search(r"Ran (\d+) tests?", output)
          if run_match is None:
              raise SystemExit("unittest output did not contain a test count")
          run_count = int(run_match.group(1))
          expected_minimum = int(os.environ["EXPECTED_MIN_TESTS"])
          skipped_match = re.search(r"skipped=(\d+)", output)
          failures_match = re.search(r"failures=(\d+)", output)
          errors_match = re.search(r"errors=(\d+)", output)
          skipped = int(skipped_match.group(1)) if skipped_match else 0
          failures = int(failures_match.group(1)) if failures_match else 0
          errors = int(errors_match.group(1)) if errors_match else 0
          summary = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as report:
              report.write(
                  f"Tests run: {run_count}; skipped: {skipped}; "
                  f"failures: {failures + errors} (assertion failures: {failures}, errors: {errors})\n"
              )
          if run_count < expected_minimum:
              raise SystemExit(
                  f"Discovered {run_count} tests; expected at least {expected_minimum}"
              )
          print(f"Discovered {run_count} tests (minimum {expected_minimum}).")
          PY
      - name: Verify tests did not modify tracked files
        if: always()
        run: python -c 'import subprocess,sys; lines=subprocess.check_output(["git","status","--porcelain"],text=True).splitlines(); allowed={"database.db","llm_usage_log.jsonl"}; bad=[line for line in lines if line[3:] not in allowed]; print("\n".join(bad)); sys.exit(bool(bad))'

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt
      - run: python -m pip install pip-audit bandit
      - run: pip-audit -r requirements.txt -r requirements-desktop.txt
      - run: bandit -r . -ll -x ./.git,./.venv,./venv,./node_modules
      # Organization-owned repositories may need a GITLEAKS_LICENSE repository secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      INSIGHTER_DISABLE_BACKGROUND_SIM: "1"
      INSIGHTER_LLM_WARMUP: "0"
      INSIGHTER_SECRET_KEY: ci
      INSIGHTER_DB_PATH: ${{ runner.temp }}/insighter-build.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -c "import app"
